# 毎朝9時の監視。問題があれば「監視」ラベル付きの Issue を作る（GitHub からメール通知が届く）。復旧したら自動で閉じる。
#
# 1. 外部リンクの確認（スポンサー・SNS・予約フォーム・お知らせ本文のリンクなど）… 常に実行
# 2. 公開中サイトの死活監視（全ページ・GA タグ・予約フォームの受付状態・旧ブログ）… 監視先が設定されているときだけ実行
#    監視先はリポジトリ変数 MONITOR_BASE_URL（Settings > Secrets and variables > Actions > Variables）。
#    本番公開後に https://www.sailabilitytokyo.jp を設定する。
name: Monitor

on:
  schedule:
    - cron: '0 0 * * *' # 毎日 9:00（日本時間）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ vars.MONITOR_BASE_URL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TITLE: 'サイト監視: 問題が見つかりました'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: 監視
        id: check
        run: |
          set +e
          failed=false
          echo "## 外部リンク" > report.txt
          npm run --silent check:external >> report.txt 2>&1 || failed=true
          if [ -n "$BASE_URL" ]; then
            printf '\n## 公開中サイト（%s）\n' "$BASE_URL" >> report.txt
            node scripts/monitor.mjs "$BASE_URL" >> report.txt 2>&1 || failed=true
          fi
          cat report.txt
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Issue を作成・更新
        if: steps.check.outputs.failed == 'true'
        run: |
          gh label create monitor --color B60205 --description "サイト監視" 2>/dev/null || true
          body=$(printf '毎朝の監視で問題が見つかりました（%s）。\n\n```\n%s\n```\n\n直し方がわからない場合は、この Issue の内容を AI に渡して「原因を調べて直して」と依頼してください。' "$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')" "$(cat report.txt)")
          num=$(gh issue list --label monitor --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body "$body"; else gh issue create --title "$TITLE" --label monitor --body "$body"; fi

      - name: 復旧したら Issue を閉じる
        if: steps.check.outputs.failed == 'false'
        run: |
          for num in $(gh issue list --label monitor --state open --json number --jq '.[].number'); do
            gh issue close "$num" --comment "監視で問題が見つからなくなったため閉じます。"
          done
