# 毎日0時過ぎにサイトを作り直す（終わった体験会の日程を表示から外すため）。
# Cloudflare Pages の「デプロイフック」URL をシークレット CLOUDFLARE_DEPLOY_HOOK に設定すると有効になる。
# 未設定の間は何もしない。
name: Daily rebuild

on:
  schedule:
    - cron: '5 15 * * *' # 毎日 0:05（日本時間）
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
    steps:
      - name: Cloudflare Pages に再ビルドを依頼
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK" > /dev/null && echo "再ビルドを依頼しました"
