# 公開前チェック。プルリクエストと main へのプッシュのたびに実行される。
# ここが全部成功（緑）にならないと main にマージできない設定にする（docs/operations.md 参照）。
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ビルドと表示確認
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: 型・内容・画像のチェック
        run: npm run check

      - name: ビルド
        run: npm run build

      - name: サイト内リンク切れチェック
        run: npm run check:links

      - name: 日本語フォントのインストール（スクリーンショット比較用）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: ブラウザのインストール
        run: npx playwright install --with-deps chromium

      - name: 表示確認テスト
        run: npm test

      - name: テスト結果（失敗時のスクリーンショット等）を保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
