# セーリング体験会・イベントの日程。
# ここに1件追加するだけで、トップページと「セーリング体験会」ページの日程表に表示されます。
# 開催日を過ぎたものは自動で表示されなくなるので、消さずに残しておいてOKです（記録になります）。
#
# 項目:
#   date:     開催日（YYYY-MM-DD）※必須
#   start/end: 開始・終了時刻（HH:MM）
#   kind:     experience = 豊洲の定例体験会（予約フォームあり） / event = 外部イベントへの出展など
#   place:    site.yaml の places の id（toyosu / yumenoshima など）
#   title:    表示名（kind: event のとき推奨）。言語ごとに書く場合は ja: / en: / zh-hans: / zh-hant:
#   deadline: 申込締切日（YYYY-MM-DD）。省略すると「開催日の2日前」になる
#   note:     補足（任意）
#   status:   scheduled（既定） / cancelled（中止）/ full（満員）

- date: 2026-08-30
  start: '13:00'
  end: '15:00'
  kind: experience
  place: toyosu
